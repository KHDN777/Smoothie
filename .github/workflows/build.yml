name: Build Smoothie (macOS universal)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3 + AU + Standalone
        run: cmake --build build --config Release --target Smoothie_VST3 Smoothie_AU Smoothie_Standalone -j 4
      - name: DSP tests
        run: |
          cmake --build build --config Release --target SmoothieTests -j 4
          ./build/SmoothieTests_artefacts/Release/SmoothieTests
      - name: Ad-hoc sign + package
        run: |
          mkdir dist
          cp -R build/Smoothie_artefacts/Release/VST3/Smoothie.vst3 dist/
          cp -R build/Smoothie_artefacts/Release/AU/Smoothie.component dist/
          cp -R build/Smoothie_artefacts/Release/Standalone/Smoothie.app dist/
          for b in dist/*; do codesign --force --deep --sign - "$b"; done
          lipo -info dist/Smoothie.vst3/Contents/MacOS/Smoothie
          cd dist && zip -ry ../Smoothie-macOS-universal.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Smoothie-macOS-universal
          path: Smoothie-macOS-universal.zip

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libgl1-mesa-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --target SmoothieTests Smoothie_VST3
      - run: ./build/SmoothieTests_artefacts/Release/SmoothieTests
